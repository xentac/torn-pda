# Opens a profile and goes to the attack page. perf-back-once then calls history.back() in the page.
# Use the snapshot replay-ready-b1-back. The recording is anon/attack.mitm.
appId: com.manuito.tornpda
---
- runFlow: dismiss-tips.yaml
- openLink: "https://www.torn.com/profiles.php?XID=8810916"
- extendedWaitUntil:
    visible:
      id: "button0-profile-8810916"
    timeout: 60000
- tapOn:
    id: "button0-profile-8810916"
# The page goes back 1.5 s after its load, often before Maestro sees the attack page.
# Wait 10 s for the attack load and the back step. The probe records show both pages.
- extendedWaitUntil:
    visible: "PDA replay: text that never shows"
    timeout: 10000
    optional: true
- extendedWaitUntil:
    visible:
      id: "button0-profile-8810916"
    timeout: 60000
- takeScreenshot: profile-back
