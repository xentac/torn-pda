# Closes the first-run screens and tips that PDA and Torn show once.
# setup.yaml runs this while it builds the replay-ready snapshot, and every test
# runs it first. If a test needs it to close something, the snapshot is out of
# date: add the new tip to setup.yaml and build the snapshot again.
# PDA's own browser tips cannot be closed here: they are not visible to Maestro
# as text. setup.yaml closes them while it builds the snapshot.
appId: com.manuito.tornpda
---
# A new build shows the changelog a few seconds after the start. Its button
# reads "Great! (3)" during a countdown and does nothing until it ends. Left
# open, its animation draws frames under the browser.
- extendedWaitUntil:
    visible: "Great!.*"
    timeout: 15000
    optional: true
# A tap during the countdown does nothing, so tap until the dialog closes.
# The wait takes its full second, because the dialog never stops moving.
- repeat:
    times: 15
    while:
      visible: "Great!.*"
    commands:
      - tapOn:
          text: "Great!.*"
          waitToSettleTimeoutMs: 500
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      visible: "Swipe right to reveal the sidebar"
    commands:
      - tapOn: "Okay"
